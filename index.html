<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEGRO COFFEE - Menu</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Coffee bean repeating pattern / textured background */
      background-color: #121212;
      background-image: radial-gradient(#262626 1px, transparent 1px), radial-gradient(#262626 1px, #121212 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      color: #ffffff;
      min-height: 100vh;
    }

    /* Hero Header Section */
    .hero-header {
      width: 100%;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(8px);
      padding: 30px 20px 20px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hero-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    /* Side Posters */
    .hero-poster {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-poster img {
      max-width: 220px;
      width: 100%;
      height: auto;
      object-fit: contain;
      /* Invert black-and-white art so line art displays cleanly on dark coffee background */
      filter: invert(1) brightness(1.2);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .hero-poster img:hover {
      transform: scale(1.04);
    }

    /* Center Logo */
    .hero-logo-wrapper {
      flex: 1.2;
      text-align: center;
    }

    .hero-logo {
      max-width: 260px;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: invert(1) brightness(1.2);
    }

    /* Category Navigation Wrapper */
    .category-nav-wrapper {
      background: rgba(18, 18, 18, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .category-nav {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      overflow-x: auto;
      padding: 15px 20px;
      gap: 12px;
      scrollbar-width: thin;
    }

    .category-nav::-webkit-scrollbar {
      height: 4px;
    }

    .category-nav::-webkit-scrollbar-thumb {
      background-color: #444;
      border-radius: 4px;
    }

    .category-btn {
      background-color: #222222;
      border: 1px solid #444444;
      color: #eeeeee;
      border-radius: 20px;
      padding: 8px 18px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.2;
    }

    .category-btn span.ar-sub {
      font-size: 0.8em;
      font-weight: normal;
      color: #aaaaaa;
      margin-top: 2px;
    }

    .category-btn:hover,
    .category-btn.active {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .category-btn:hover span.ar-sub,
    .category-btn.active span.ar-sub {
      color: #333333;
    }

    /* Menu Section Container */
    .menu-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .category-section {
      margin-bottom: 45px;
    }

    .category-title {
      font-size: 1.8rem;
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 8px;
      display: flex;
      align-items: baseline;
      gap: 10px;
      color: #ffffff;
    }

    .category-title .ar-title {
      font-size: 1.3rem;
      color: #cccccc;
      font-weight: normal;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }

    .item-card {
      background-color: rgba(255, 255, 255, 0.95);
      color: #111111;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .item-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .item-image {
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .item-name-en {
      font-weight: 700;
      font-size: 1.1rem;
      color: #111;
    }

    .item-name-ar {
      font-size: 0.95rem;
      color: #555;
      margin-top: 2px;
      direction: rtl;
    }

    .item-prices {
      margin-top: 12px;
      font-weight: bold;
      color: #000000;
      font-size: 1.05rem;
      background: #f0f0f0;
      padding: 4px 12px;
      border-radius: 12px;
    }

    /* Responsive Mobile Layout */
    @media (max-width: 768px) {
      .hero-container {
        flex-direction: column;
        text-align: center;
        gap: 15px;
      }

      .hero-logo-wrapper {
        order: 1;
      }

      .hero-poster {
        display: none;
      }

      .hero-logo {
        max-width: 190px;
      }
    }
  </style>
</head>
<body>

  <!-- Hero Header Section -->
  <header class="hero-header">
    <div class="hero-container">
      <!-- Left Poster -->
      <div class="hero-poster poster-left">
        <img src="poster 1.png" alt="Cafe Vibe 1" />
      </div>

      <!-- Center Logo -->
      <div class="hero-logo-wrapper">
        <img src="Logo.png" alt="NEGRO COFFEE" class="hero-logo" />
      </div>

      <!-- Right Poster -->
      <div class="hero-poster poster-right">
        <img src="poster 2.png" alt="Cafe Vibe 2" />
      </div>
    </div>
  </header>

  <!-- Navigation Bar for Categories -->
  <div class="category-nav-wrapper">
    <nav class="category-nav" id="categoryNav"></nav>
  </div>

  <!-- Main Menu Display Area -->
  <main class="menu-container" id="menuContainer"></main>

  <script src="menu-data.js"></script>
